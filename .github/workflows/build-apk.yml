name: Build APK - Journal Zoe 3D
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Generate valid icon (fix CRC)
        run: |
          pip install Pillow -q
          mkdir -p assets/images assets/lottie
          python3 -c "from PIL import Image; Image.new('RGB', (1024,1024), (13,8,32)).save('assets/images/icon.png')"
          echo '{"v":"5.5.7"}' > assets/lottie/sparkle.json
      - name: Install deps
        run: npm install
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
      - name: Fix Expo SDK 51 - patch release property + plugin
        run: |
          echo "Patching ExpoModulesCorePlugin.gradle..."
          sed -i 's/components\.release/components.findByName("release")/g' node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle || true
          sed -i 's/project\.components\.release/project.components.findByName("release")/g' node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle || true
          # Fix second place where release is used
          sed -i 's/def releaseComponent = project.components.release/def releaseComponent = project.components.findByName("release")/g' node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle || true
          cat node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle | grep -n "release" | head -20
          
          echo "Forcing Gradle 8.6..."
          sed -i "s/gradle-.*-all.zip/gradle-8.6-all.zip/g" android/gradle/wrapper/gradle-wrapper.properties
          
          echo "Force AGP 8.1.4 to avoid release property bug..."
          sed -i "s/com.android.tools.build:gradle:8.2.1/com.android.tools.build:gradle:8.1.4/g" android/build.gradle
          cat android/build.gradle | grep gradle
      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: journal-zoe-3d-apk, path: android/app/build/outputs/apk/release/*.apk }
