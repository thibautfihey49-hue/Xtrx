name: Build APK - EAS Local
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Generate valid icon
        run: |
          pip install Pillow -q
          mkdir -p assets/images assets/lottie
          python3 -c "from PIL import Image; Image.new('RGB', (1024,1024), (13,8,32)).save('assets/images/icon.png')"
          echo '{"v":"5.5.7"}' > assets/lottie/sparkle.json
      - name: Setup EAS
        run: npm install -g eas-cli
      - name: Install deps
        run: npm install
      - name: Build APK local
        run: eas build --platform android --profile local --local --non-interactive --output ./app-release.apk --no-wait
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: journal-zoe-3d-apk, path: app-release.apk }
