name: Build APK - Journal Zoe 3D
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Generate icon + deps
        run: |
          pip install Pillow -q
          mkdir -p assets/images assets/lottie
          python3 -c "from PIL import Image; Image.new('RGB', (1024,1024), (13,8,32)).save('assets/images/icon.png')"
          echo '{"v":"5.5.7"}' > assets/lottie/sparkle.json
          npm install
      - name: Prebuild
        run: npx expo prebuild --platform android --clean
      - name: Fix settings.gradle with repositories
        run: |
          cat > android/settings.gradle << 'GRADLE'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
            includeBuild("../node_modules/expo-modules-core/android")
            includeBuild("../node_modules/@react-native/gradle-plugin")
            includeBuild("../node_modules/@expo/prebuild-config")
          }
          plugins {
            id("com.facebook.react.settings")
          }
          extensions.configure(com.facebook.react.ReactSettingsExtension){ ex ->
            ex.autolinkLibrariesFromCommand()
          }
          include ':app'
          includeBuild("../node_modules/@react-native/gradle-plugin")
          GRADLE
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo "=== wrapper ==="
          sed -i "s/gradle-.*-all.zip/gradle-8.6-all.zip/g" android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== build.gradle patch ==="
          sed -i "s/com.android.tools.build:gradle:8.2.1/com.android.tools.build:gradle:8.1.4/g" android/build.gradle
          sed -i 's/components\.release/components.findByName("release")/g' node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - name: Build APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleRelease --info
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: journal-zoe-3d-apk, path: android/app/build/outputs/apk/release/*.apk }
