name: Build APK - Journal Zoe 3D
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Generate icon + deps
        run: |
          pip install Pillow -q
          mkdir -p assets/images assets/lottie
          python3 -c "from PIL import Image; Image.new('RGB', (1024,1024), (13,8,32)).save('assets/images/icon.png')"
          echo '{"v":"5.5.7"}' > assets/lottie/sparkle.json
          npm install
      - name: Prebuild
        run: npx expo prebuild --platform android --clean
      - name: Fix Gradle
        run: |
          cat > android/settings.gradle << 'GRADLE'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
            includeBuild("../node_modules/expo-modules-core/android")
            includeBuild("../node_modules/@react-native/gradle-plugin")
            includeBuild("../node_modules/@expo/prebuild-config")
          }
          plugins {
            id("com.facebook.react.settings")
          }
          extensions.configure(com.facebook.react.ReactSettingsExtension){ ex ->
            ex.autolinkLibrariesFromCommand()
          }
          include ':app'
          includeBuild("../node_modules/@react-native/gradle-plugin")
          GRADLE
          sed -i "s/gradle-.*-all.zip/gradle-8.6-all.zip/g" android/gradle/wrapper/gradle-wrapper.properties
          sed -i "s/com.android.tools.build:gradle:8.2.1/com.android.tools.build:gradle:8.1.4/g" android/build.gradle
          python3 << 'PY'
          import pathlib, re
          for path_str in ["node_modules/expo-modules-core/android/build.gradle", "node_modules/@expo/prebuild-config/build.gradle"]:
              p = pathlib.Path(path_str)
              if not p.exists(): continue
              txt = p.read_text()
              # fix release
              txt = txt.replace("components.release", 'components.findByName("release")')
              # ensure buildscript has google()
              if "buildscript" in txt:
                  # add google() inside existing buildscript repositories if missing
                  txt = txt.replace("repositories {", "repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n", 1)
              else:
                  # add minimal buildscript at top
                  txt = "buildscript { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n" + txt
              p.write_text(txt)
              print(f"Patched {path_str}")
          PY
      - name: Build APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: journal-zoe-3d-apk, path: android/app/build/outputs/apk/release/*.apk }
