name: Build APK - Journal Zoe 3D
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Generate valid icon (fix CRC Jimp)
        run: |
          pip install Pillow -q
          mkdir -p assets/images assets/lottie
          python3 -c "from PIL import Image; Image.new('RGB', (1024,1024), (13,8,32)).save('assets/images/icon.png')"
          echo '{"v":"5.5.7"}' > assets/lottie/sparkle.json
      - name: Install deps
        run: npm install
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
      - name: Fix Gradle 8.6 + AGP 8.2.1 (Expo 51)
        run: |
          echo "Forcing Gradle 8.6 for Expo SDK 51..."
          sed -i "s/gradle-.*-all.zip/gradle-8.6-all.zip/g" android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          # Garde AGP 8.2.1 (ne downgrade pas en 8.1.4)
          grep -n "com.android.tools.build:gradle" android/build.gradle
      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --warning-mode all
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: journal-zoe-3d-apk, path: android/app/build/outputs/apk/release/*.apk }
