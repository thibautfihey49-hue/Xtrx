name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: npm install --legacy-peer-deps
      - run: npx expo prebuild --clean --no-install
      - name: Force minSdk 24
        run: |
          echo "--- BEFORE ---"
          grep -R "minSdkVersion" android/ || true
          find android -name "build.gradle" -exec sed -i -E "s/minSdkVersion[[:space:]]*=?[[:space:]]*23/minSdkVersion = 24/g" {} \;
          find android -name "build.gradle" -exec sed -i -E "s/minSdk[[:space:]]*=?[[:space:]]*23/minSdk = 24/g" {} \;
          echo "--- AFTER ---"
          grep -R "minSdkVersion" android/ || true
      - run: cd android && chmod +x gradlew &&./gradlew assembleRelease --no-daemon -x lint
      - uses: actions/upload-artifact@v4
        with:
          name: Zoey-APK
          path: android/app/build/outputs/apk/release/app-release.apk
