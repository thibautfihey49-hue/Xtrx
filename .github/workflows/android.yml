name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install --legacy-peer-deps
      - run: npx expo prebuild --clean --no-install
      - name: Force minSdk 24
        run: |
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = 21/minSdkVersion = 24/g' android/app/build.gradle || true
          grep -n minSdkVersion android/app/build.gradle
      - run: cd android && chmod +x gradlew &&./gradlew assembleRelease --no-daemon -x lint
      - uses: actions/upload-artifact@v4
        with:
          name: Zoey-APK
          path: android/app/build/outputs/apk/release/app-release.apk
